<!-- Atmosphere Micro-interaction -->
<script>
        document.addEventListener('mousemove', (e) => {
            const photos = document.querySelectorAll('.scrapbook-photo');
            photos.forEach(photo => {
                const rect = photo.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                // Very subtle tilt following the mouse
                const rotateX = -y / 100;
                const rotateY = x / 100;
                
                photo.parentElement.style.transform = `rotate(-3deg) perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
        });
    </script>
